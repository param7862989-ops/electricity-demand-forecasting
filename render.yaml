# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: electricity-demand-api
    runtime: docker
    plan: free
    healthCheckPath: /health

  - type: web
    name: electricity-demand-dashboard
    runtime: docker
    plan: free
    envVars:
      - key: APP
        value: dashboard
      - key: API_URL
        fromService:
          type: web
          name: electricity-demand-api
          envVarKey: RENDER_EXTERNAL_URL
